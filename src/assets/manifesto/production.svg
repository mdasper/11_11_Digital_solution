<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E12" />
      <stop offset="100%" stop-color="#080709" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#prodGrad)" />
  <circle cx="200" cy="200" r="160" fill="#FF1A63" opacity="0.18" filter="blur(60px)" />
  <!-- Cinema Matte Box Outline -->
  <rect x="120" y="80" width="360" height="240" rx="20" fill="none" stroke="#F8115A" stroke-width="2" opacity="0.6" />
  <!-- Crosshairs -->
  <line x1="300" y1="180" x2="300" y2="220" stroke="#ffffff" stroke-width="2" />
  <line x1="280" y1="200" x2="320" y2="200" stroke="#ffffff" stroke-width="2" />
  <circle cx="300" cy="200" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
  <!-- Camera HUD info -->
  <text x="140" y="115" fill="#FF1A63" font-family="monospace" font-size="13" font-weight="bold">● REC [4K 60FPS]</text>
  <text x="380" y="115" fill="#FFFFFF" font-family="monospace" font-size="13">SHUTTER 1/120</text>
  <text x="140" y="295" fill="#8E8790" font-family="monospace" font-size="12">ISO 800 · T2.0</text>
  <text x="380" y="295" fill="#F8115A" font-family="monospace" font-size="12">AUDIO: -12dB PEAK</text>
</svg>
