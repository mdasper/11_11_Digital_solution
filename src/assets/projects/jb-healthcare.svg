<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0A0C" />
      <stop offset="60%" stop-color="#1B1619" />
      <stop offset="100%" stop-color="#2B151F" />
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A63" />
      <stop offset="100%" stop-color="#C2104A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="900" y1="0" x2="900" y2="750" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="950" cy="200" r="280" fill="#F8115A" opacity="0.18" filter="blur(60px)" />

  <!-- Navbar Mockup -->
  <rect x="80" y="40" width="1040" height="60" rx="30" fill="#1B1619" stroke="#ffffff" stroke-opacity="0.12" />
  <circle cx="120" cy="70" r="12" fill="#F8115A" />
  <text x="145" y="76" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="bold" font-size="18">JB HEALTHCARE SIVAKASI</text>
  <rect x="940" y="52" width="160" height="36" rx="18" fill="url(#crimson)" />
  <text x="965" y="75" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Book Appointment</text>

  <!-- Hero Content -->
  <text x="100" y="200" fill="#F8115A" font-family="monospace" font-size="14" letter-spacing="3">|| HOSPITAL &amp; MULTISPECIALITY CARE</text>
  <text x="100" y="270" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="800" font-size="52">Compassionate Care.</text>
  <text x="100" y="335" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="800" font-size="52">Modern Medicine.</text>
  <text x="100" y="385" fill="#8E8790" font-family="sans-serif" font-size="18">24/7 Emergency · Cardiology · Orthopaedics · Pediatrics · Advanced Diagnostics</text>

  <!-- KPI Badges -->
  <rect x="100" y="440" width="220" height="120" rx="20" fill="#1B1619" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="130" y="490" fill="#F8115A" font-family="'Sora', sans-serif" font-weight="800" font-size="36">24/7</text>
  <text x="130" y="525" fill="#8E8790" font-family="sans-serif" font-size="14">Emergency Response</text>

  <rect x="340" y="440" width="220" height="120" rx="20" fill="#1B1619" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="370" y="490" fill="#F8115A" font-family="'Sora', sans-serif" font-weight="800" font-size="36">15+</text>
  <text x="370" y="525" fill="#8E8790" font-family="sans-serif" font-size="14">Senior Specialists</text>

  <rect x="580" y="440" width="220" height="120" rx="20" fill="#1B1619" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="610" y="490" fill="#F8115A" font-family="'Sora', sans-serif" font-weight="800" font-size="36">3.4x</text>
  <text x="610" y="525" fill="#8E8790" font-family="sans-serif" font-size="14">Patient Inquiries Growth</text>

  <!-- ECG Line Graphic -->
  <path d="M 820 500 L 890 500 L 910 440 L 935 550 L 960 480 L 980 520 L 1000 500 L 1080 500" fill="none" stroke="#F8115A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
