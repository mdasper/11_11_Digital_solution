<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGarments" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0D0E" />
      <stop offset="60%" stop-color="#14171A" />
      <stop offset="100%" stop-color="#1E232A" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGarments)" />

  <!-- Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="440" x2="1200" y2="440" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <circle cx="1000" cy="400" r="300" fill="#7A0A2E" opacity="0.25" filter="blur(80px)" />

  <!-- Navbar -->
  <rect x="80" y="40" width="1040" height="60" rx="14" fill="#14171A" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="120" y="76" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="800" font-size="20">FAZIL GARMENTS EXPORTS</text>
  <text x="960" y="75" fill="#F8115A" font-family="monospace" font-size="13">ISO 9001:2015 CERTIFIED</text>

  <!-- Typography -->
  <text x="120" y="210" fill="#F8115A" font-family="monospace" font-size="14" letter-spacing="3">|| APPAREL MANUFACTURING &amp; EXPORT</text>
  <text x="120" y="290" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="800" font-size="60">Engineered Apparel.</text>
  <text x="120" y="360" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="800" font-size="60">Global Precision.</text>
  <text x="120" y="415" fill="#8E8790" font-family="sans-serif" font-size="18">High-volume woven &amp; knit manufacturing exporting to UK, USA &amp; European retail giants.</text>

  <!-- Specification Cards -->
  <g transform="translate(120, 470)">
    <rect width="280" height="160" rx="16" fill="#14171A" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="30" y="50" fill="#8E8790" font-family="monospace" font-size="12">CAPACITY</text>
    <text x="30" y="90" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="32">500,000</text>
    <text x="30" y="125" fill="#F8115A" font-family="sans-serif" font-size="14">Pieces / Month</text>
  </g>

  <g transform="translate(430, 470)">
    <rect width="280" height="160" rx="16" fill="#14171A" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="30" y="50" fill="#8E8790" font-family="monospace" font-size="12">OEKO-TEX STANDARD</text>
    <text x="30" y="90" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="32">100%</text>
    <text x="30" y="125" fill="#F8115A" font-family="sans-serif" font-size="14">Eco-Compliant Dyes</text>
  </g>

  <g transform="translate(740, 470)">
    <rect width="340" height="160" rx="16" fill="#1B1619" stroke="#F8115A" stroke-width="2" />
    <text x="35" y="50" fill="#F8115A" font-family="monospace" font-size="12">B2B RFQ PORTAL</text>
    <text x="35" y="90" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="24">+42% RFQ Growth</text>
    <text x="35" y="125" fill="#8E8790" font-family="sans-serif" font-size="14">Real-time fabric sample requests</text>
  </g>
</svg>
