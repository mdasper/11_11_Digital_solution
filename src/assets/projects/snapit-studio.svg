<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSnapit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080709" />
      <stop offset="50%" stop-color="#140D13" />
      <stop offset="100%" stop-color="#240D18" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgSnapit)" />
  <circle cx="600" cy="300" r="320" fill="#F8115A" opacity="0.22" filter="blur(90px)" />

  <!-- Navbar -->
  <rect x="80" y="40" width="1040" height="60" rx="14" fill="#140D13" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="120" y="76" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="900" font-size="20">SNAPIT STUDIO</text>
  <circle cx="280" cy="70" r="5" fill="#F8115A" />
  <text x="960" y="75" fill="#F8115A" font-family="monospace" font-size="13">4K SHOWREEL ACTIVE</text>

  <!-- Typography -->
  <text x="120" y="210" fill="#F8115A" font-family="monospace" font-size="14" letter-spacing="4">|| COMMERCIAL VIDEO PRODUCTION</text>
  <text x="120" y="290" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="900" font-size="64">Cinematic Motion.</text>
  <text x="120" y="360" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="900" font-size="64">Unrivaled Pacing.</text>
  <text x="120" y="415" fill="#8E8790" font-family="sans-serif" font-size="18">Commercial advertisements, viral reels, and music videos engineered for maximum retention.</text>

  <!-- Timeline Interface Graphic -->
  <g transform="translate(120, 470)">
    <rect width="960" height="170" rx="20" fill="#110B10" stroke="#ffffff" stroke-opacity="0.12" />
    
    <!-- Timeline Ruler -->
    <line x1="40" y1="40" x2="920" y2="40" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
    <line x1="180" y1="35" x2="180" y2="45" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <line x1="360" y1="35" x2="360" y2="45" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <line x1="540" y1="35" x2="540" y2="45" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <line x1="720" y1="35" x2="720" y2="45" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />

    <!-- Tracks -->
    <rect x="40" y="60" width="340" height="40" rx="8" fill="#F8115A" opacity="0.8" />
    <text x="55" y="85" fill="#FFFFFF" font-family="monospace" font-size="12">VIDEO 01: 4K A-ROLL [RED V-RAPTOR]</text>

    <rect x="400" y="60" width="280" height="40" rx="8" fill="#C2104A" opacity="0.8" />
    <text x="415" y="85" fill="#FFFFFF" font-family="monospace" font-size="12">VIDEO 02: B-ROLL MACRO CUTS</text>

    <rect x="700" y="60" width="220" height="40" rx="8" fill="#7A0A2E" opacity="0.8" />
    <text x="715" y="85" fill="#FFFFFF" font-family="monospace" font-size="12">COLOR GRADE: CINEMA LUT</text>

    <!-- Audio Track -->
    <rect x="40" y="110" width="880" height="35" rx="8" fill="#1A1218" />
    <!-- Audio Waveform -->
    <path d="M 60 127 Q 80 115 100 127 T 140 127 T 180 127 T 220 127 T 260 127 T 300 127 T 340 127 T 380 127 T 420 127 T 460 127 T 500 127 T 540 127 T 580 127 T 620 127 T 660 127 T 700 127 T 740 127 T 780 127 T 820 127 T 860 127 T 900 127" fill="none" stroke="#F8115A" stroke-width="2" />
  </g>
</svg>
