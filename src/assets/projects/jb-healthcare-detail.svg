      <stop offset="0%" stop-color="#1B1619" />
      <stop offset="100%" stop-color="#0D0A0C" />
    </linearGradient>
    <linearGradient id="jbCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A63" />
      <stop offset="100%" stop-color="#C2104A" />
    </linearGradient>
  </defs>
  <rect width="1000" height="650" fill="url(#jbDetailBg)" rx="24" />
  <rect x="1" y="1" width="998" height="648" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" rx="23" />
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="920" height="64" rx="16" fill="#201A1D" stroke="#FFFFFF" stroke-opacity="0.08" />
  <text x="70" y="78" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="16">JB Clinical Appointment &amp; Schedule Flow</text>
  <rect x="780" y="54" width="150" height="36" rx="18" fill="url(#jbCrimson)" />
  <text x="806" y="77" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Sync Calendar</text>

  <!-- Left: Doctor Directory Cards -->
  <g transform="translate(40, 130)">
    <rect width="440" height="140" rx="18" fill="#151214" stroke="#FFFFFF" stroke-opacity="0.08" />
