    <text x="55" y="206" fill="#8E8790" font-family="sans-serif" font-size="13">Contact Phone (+91)</text>

    <!-- Date selector chips -->
    <text x="35" y="260" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Select Date Slot</text>
