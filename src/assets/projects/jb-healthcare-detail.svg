    <text x="52" y="76" fill="#FF1A63" font-family="'Sora', sans-serif" font-weight="700" font-size="16">DR</text>
    <text x="110" y="55" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="18">Dr. K. Ravichandran</text>
    <text x="110" y="80" fill="#FF1A63" font-family="sans-serif" font-size="13" font-weight="600">Chief Interventional Cardiologist</text>
    <text x="110" y="105" fill="#8E8790" font-family="sans-serif" font-size="12">MBBS, MD, DM · 18+ Yrs Experience · Available 10AM - 2PM</text>

    <rect y="160" width="440" height="140" rx="18" fill="#151214" stroke="#FFFFFF" stroke-opacity="0.08" />
    <circle cx="60" cy="230" r="32" fill="#2B1D23" stroke="#FF1A63" stroke-width="2" />
    <text x="52" y="236" fill="#FF1A63" font-family="'Sora', sans-serif" font-weight="700" font-size="16">DR</text>
    <text x="110" y="215" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="18">Dr. Ananya Sharma</text>
    <text x="110" y="240" fill="#FF1A63" font-family="sans-serif" font-size="13" font-weight="600">Senior Pediatric Surgeon</text>
    <text x="110" y="265" fill="#8E8790" font-family="sans-serif" font-size="12">MBBS, MS, MCh · 14+ Yrs Experience · Available 3PM - 7PM</text>

    <rect y="320" width="440" height="140" rx="18" fill="#151214" stroke="#FFFFFF" stroke-opacity="0.08" />
    <circle cx="60" cy="390" r="32" fill="#2B1D23" stroke="#FF1A63" stroke-width="2" />
    <text x="52" y="396" fill="#FF1A63" font-family="'Sora', sans-serif" font-weight="700" font-size="16">DR</text>
    <text x="110" y="375" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="18">Dr. S. Sundararajan</text>
    <text x="110" y="400" fill="#FF1A63" font-family="sans-serif" font-size="13" font-weight="600">Head of Orthopaedics &amp; Trauma</text>
    <text x="110" y="425" fill="#8E8790" font-family="sans-serif" font-size="12">MS (Ortho), DNB · 20+ Yrs Experience · 24/7 Trauma Unit</text>
  </g>

  <!-- Right: Patient Booking Widget -->
  <g transform="translate(520, 130)">
