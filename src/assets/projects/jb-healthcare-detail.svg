    <text x="58" y="302" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">TODAY</text>
    <text x="58" y="318" fill="#FFE8EE" font-family="sans-serif" font-size="10">24 Nov</text>

    <rect x="125" y="280" width="80" height="48" rx="10" fill="#201A1D" stroke="#FFFFFF" stroke-opacity="0.1" />
    <text x="146" y="302" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">TOM</text>
    <text x="148" y="318" fill="#8E8790" font-family="sans-serif" font-size="10">25 Nov</text>

    <rect x="215" y="280" width="80" height="48" rx="10" fill="#201A1D" stroke="#FFFFFF" stroke-opacity="0.1" />
    <text x="238" y="302" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">WED</text>
    <text x="238" y="318" fill="#8E8790" font-family="sans-serif" font-size="10">26 Nov</text>

    <rect x="305" y="280" width="100" height="48" rx="10" fill="#201A1D" stroke="#FFFFFF" stroke-opacity="0.1" />
    <text x="328" y="302" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">CUSTOM</text>
    <text x="338" y="318" fill="#8E8790" font-family="sans-serif" font-size="10">Pick Date</text>

    <!-- Submit CTA Button -->
    <rect x="35" y="365" width="370" height="56" rx="28" fill="url(#jbCrimson)" />
    <text x="145" y="400" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="16">Confirm Slot</text>
