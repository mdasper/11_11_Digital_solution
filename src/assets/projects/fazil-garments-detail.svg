<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="fazilDetailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A151C" />
      <stop offset="100%" stop-color="#0E0A0E" />
    </linearGradient>
    <linearGradient id="fzCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A63" />
      <stop offset="100%" stop-color="#C2104A" />
    </linearGradient>
  </defs>
  <rect width="1000" height="650" fill="url(#fazilDetailBg)" rx="24" />
  <rect x="1" y="1" width="998" height="648" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" rx="23" />
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="920" height="64" rx="16" fill="#241B26" stroke="#FFFFFF" stroke-opacity="0.08" />
  <text x="70" y="78" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="16">Fazil Garments · Global B2B RFQ &amp; Manufacturing Spec Engine</text>
  <rect x="800" y="54" width="130" height="36" rx="18" fill="url(#fzCrimson)" />
  <text x="826" y="77" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Submit RFQ</text>

  <!-- Left: Production Line Status & Metrics -->
  <g transform="translate(40, 130)">
    <rect width="440" height="460" rx="20" fill="#151117" stroke="#FFFFFF" stroke-opacity="0.08" />
    <text x="35" y="45" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="20">Factory Throughput Metrics</text>
    <text x="35" y="75" fill="#8E8790" font-family="sans-serif" font-size="13">Tirupur Facility 01 &amp; 02 · SEDEX SMETA 4-Pillar Audited</text>

    <!-- 4 Stats grid -->
    <g transform="translate(35, 100)">
      <rect width="170" height="95" rx="14" fill="#221A26" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="20" y="40" fill="#FF1A63" font-family="'Sora', sans-serif" font-weight="800" font-size="26">500,000</text>
      <text x="20" y="70" fill="#8E8790" font-family="sans-serif" font-size="12">Pcs / Month Capacity</text>
    </g>

    <g transform="translate(235, 100)">
      <rect width="170" height="95" rx="14" fill="#221A26" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="20" y="40" fill="#FF1A63" font-family="'Sora', sans-serif" font-weight="800" font-size="26">0.2%</text>
      <text x="20" y="70" fill="#8E8790" font-family="sans-serif" font-size="12">AQL Defect Rate</text>
    </g>

    <g transform="translate(35, 215)">
      <rect width="170" height="95" rx="14" fill="#221A26" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="20" y="40" fill="#FF1A63" font-family="'Sora', sans-serif" font-weight="800" font-size="26">100%</text>
      <text x="20" y="70" fill="#8E8790" font-family="sans-serif" font-size="12">GOTS Organic Certified</text>
    </g>

    <g transform="translate(235, 215)">
      <rect width="170" height="95" rx="14" fill="#221A26" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="20" y="40" fill="#FF1A63" font-family="'Sora', sans-serif" font-weight="800" font-size="26">28 Days</text>
      <text x="20" y="70" fill="#8E8790" font-family="sans-serif" font-size="12">Production Turnaround</text>
    </g>

    <!-- Certifications pill bar -->
    <rect x="35" y="340" width="370" height="55" rx="12" fill="#201724" stroke="#FF1A63" stroke-opacity="0.3" />
    <text x="55" y="373" fill="#FFE8EE" font-family="sans-serif" font-size="13" font-weight="600">OEKO-TEX Standard 100 · BCI Cotton · ISO 9001:2015</text>
  </g>

  <!-- Right: Fabric & Garment Configurator -->
  <g transform="translate(520, 130)">
    <rect width="440" height="460" rx="20" fill="#151117" stroke="#FFFFFF" stroke-opacity="0.08" />
    <text x="35" y="45" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="20">Digital Fabric Specifier</text>

    <g transform="translate(35, 80)">
      <rect width="370" height="60" rx="10" fill="#201724" stroke="#FFFFFF" stroke-opacity="0.1" />
      <text x="20" y="28" fill="#8E8790" font-family="sans-serif" font-size="11">FABRIC GSM &amp; COMPOSITION</text>
      <text x="20" y="48" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">240 GSM Heavyweight French Terry Cotton</text>
    </g>

    <g transform="translate(35, 155)">
      <rect width="370" height="60" rx="10" fill="#201724" stroke="#FFFFFF" stroke-opacity="0.1" />
      <text x="20" y="28" fill="#8E8790" font-family="sans-serif" font-size="11">DYEING &amp; FINISH TECHNIQUE</text>
      <text x="20" y="48" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Bio-Washed · Reactive Low-Impact Dye</text>
    </g>

    <g transform="translate(35, 230)">
      <rect width="370" height="60" rx="10" fill="#201724" stroke="#FFFFFF" stroke-opacity="0.1" />
      <text x="20" y="28" fill="#8E8790" font-family="sans-serif" font-size="11">ESTIMATED MINIMUM ORDER QUANTITY</text>
      <text x="20" y="48" fill="#FF1A63" font-family="sans-serif" font-weight="bold" font-size="14">500 Pieces / Colorway</text>
    </g>

    <!-- Request Tech Pack Button -->
    <rect x="35" y="355" width="370" height="56" rx="28" fill="url(#fzCrimson)" />
    <text x="125" y="390" fill="#FFFFFF" font-family="'Sora', sans-serif" font-weight="700" font-size="16">Download Tech Pack Spec</text>
  </g>
</svg>
